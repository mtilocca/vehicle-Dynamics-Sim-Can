# .github/workflows/cmake-CI-pipeline.yml
name: CMake CI (Ubuntu)

on:
  push:
    branches: ["main"]
    tags:     ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: "Upload built binaries for a new pre-release"
        type: boolean
        required: true
        default: false

# ──────────────────────────────────────────────────────────────────────────────
# Job 1 — Native build + test (Debug AND Release via matrix)
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  build-test:
    name: build-test (${{ matrix.build_type }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false          # let both matrix legs finish independently
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      # ── apt cache ─────────────────────────────────────────────────────────────
      # Caches .deb files keyed on the package list + Ubuntu image digest.
      # Saves ~15-20 s per run. Bump version: if the package list changes.
      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >
            pkg-config
            libyaml-cpp-dev
            liblua5.4-dev
            libcurl4-openssl-dev
          version: 1.0

      # ── GTest FetchContent cache ─────────────────────────────────────────────
      # CMakeLists.txt contains GIT_TAG v1.14.0, so the cache auto-invalidates
      # when the GTest version changes. Saves ~40-60 s per run.
      - name: Cache GTest FetchContent
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: gtest-fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            gtest-fetchcontent-${{ runner.os }}-

      # ── Configure ─────────────────────────────────────────────────────────────
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTING=ON \
            -S .

      # ── Build ─────────────────────────────────────────────────────────────────
      # sim_main must exist before test_smoke runs (smoke test spawns the binary).
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j$(nproc)

      # ── Test ──────────────────────────────────────────────────────────────────
      # working-directory: build  — required: gtest_discover_tests() roots test
      #   entries at the CMake binary dir; running ctest from the workspace root
      #   causes "No tests were found". cd build && ctest is the correct form.
      # -j$(nproc)               — run the 13 test executables in parallel
      # --output-junit           — JUnit XML for artifact upload (CMake 3.21+)
      - name: Test
        working-directory: build
        run: |
          ctest \
            --build-config ${{ matrix.build_type }} \
            --output-on-failure \
            --output-junit test-results.xml \
            -j$(nproc)

      # ── Upload test results (always, so failures are captured too) ─────────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.build_type }}
          path: build/test-results.xml
          if-no-files-found: warn

      # ── Stash Release binaries for the release job ────────────────────────────
      - name: Upload Release binaries
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            build/src/sim/sim_main
            build/src/can/vcan_listener
            build/src/can/vcan_random_sender
          if-no-files-found: error

# ──────────────────────────────────────────────────────────────────────────────
# Job 2 — ARM64 cross-compile
# ──────────────────────────────────────────────────────────────────────────────
  cross-compile-arm:
    name: cross-compile (arm64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Fix apt sources for multiarch ─────────────────────────────────────────
      # GitHub's ubuntu-latest (Ubuntu 24.04 noble) configures security.ubuntu.com
      # for amd64 only. After dpkg --add-architecture arm64, apt-get update tries
      # to fetch arm64 indexes from the same mirror and gets 404s.
      #
      # Fix: restrict existing sources to [arch=amd64] and add ports.ubuntu.com
      # as the arm64 source. This must happen BEFORE cross_arm_build.sh calls
      # dpkg --add-architecture + apt-get update.
      - name: Configure apt sources for ARM64 multiarch
        run: |
          CODENAME=$(lsb_release -cs)

          # Ubuntu 24.04+ uses DEB822 format: add "Architectures: amd64" after
          # each "Types: deb" line to pin those stanzas to amd64 only.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types: deb/a Architectures: amd64' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi

          # Legacy one-liner format: add [arch=amd64] qualifier if not already set.
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i \
              's|^deb \(https\{0,1\}://\)|deb [arch=amd64] \1|g' \
              /etc/apt/sources.list
          fi

          # Add ports.ubuntu.com as the arm64 package source.
          {
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME} main restricted universe multiverse"
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-updates main restricted universe multiverse"
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-security main restricted universe multiverse"
          } | sudo tee /etc/apt/sources.list.d/arm64-cross.list

      - name: Run ARM64 cross-compile script
        run: |
          chmod +x cross_arm_build.sh
          ./cross_arm_build.sh arm64

# ──────────────────────────────────────────────────────────────────────────────
# Job 3 — Package and upload release artifact
# Runs on: (a) v*.*.* tag push  OR  (b) manual dispatch with publish_prerelease
# ──────────────────────────────────────────────────────────────────────────────
  release:
    name: release
    runs-on: ubuntu-latest
    needs: build-test
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_prerelease)

    steps:
      - uses: actions/checkout@v4

      - name: Download Release binaries
        uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist-bin/

      - name: Assemble tarball
        run: |
          set -euxo pipefail
          mkdir -p dist

          cp -v dist-bin/sim_main            dist/ || true
          cp -v dist-bin/vcan_listener       dist/ || true
          cp -v dist-bin/vcan_random_sender  dist/ || true
          chmod +x dist/* 2>/dev/null || true

          if [ -d config ]; then
            cp -rv config dist/
          fi

          # GITHUB_REF_NAME = tag name on tag push (e.g. v1.2.3), branch name otherwise
          RELEASE_NAME="vehicle-dynamics-sim-linux-${GITHUB_REF_NAME:-${{ github.sha }}}"
          tar -czf "${RELEASE_NAME}.tar.gz" -C dist .

          echo "=== Tarball contents ==="
          tar -tzf "${RELEASE_NAME}.tar.gz"

          echo "RELEASE_NAME=${RELEASE_NAME}" >> "$GITHUB_ENV"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}
          path: ${{ env.RELEASE_NAME }}.tar.gz
          if-no-files-found: error
