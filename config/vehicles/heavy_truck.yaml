# XCMG XDE320 Electric Dump Truck
# 320-tonne payload electric mining haul truck (Pilbara, Western Australia)

vehicle:
  name: "HEavy Duty Generic Truck"
  description: "320-tonne electric dump truck — simplified 3-DOF plant model"
  manufacturer: "Any"
  year: 2025

  # Physical dimensions and mass
  geometry:
    mass_kg: 218000.0                  # 218 tonnes empty weight
    wheelbase_m: 6.30                  # 6.3 m wheelbase
    track_width_m: 7.20                # 7.2 m track width
    wheel_radius_m: 1.93               # ~3.86 m diameter tyres (40.00R57)
    cg_height_m: 3.20                  # Estimated centre-of-gravity height
    cg_to_front_axle_m: 2.52          # CoG → front axle (40 % of wheelbase)
    cg_to_rear_axle_m: 3.78           # CoG → rear axle  (60 % of wheelbase)
    yaw_inertia_kgm2: 6800000.0        # Yaw moment of inertia (6.8e6 kg·m²)

  # Electric drivetrain
  drivetrain:
    motor_torque_max_nm: 95000.0        # Input shaft torque (before gear ratio)
    motor_power_max_w: 2800000.0       # 2.8 MW peak
    gear_ratio: 25.0                   # Wheel-to-motor reduction
    efficiency: 0.92                   # Drivetrain efficiency

  # Braking system
  brakes:
    brake_torque_max_nm: 80000.0       # Maximum brake torque at wheel [Nm]
    brake_bias_front: 0.40             # Front axle share of total brake force

  # Resistive forces
  # Crr ≈ 0.007 for truck tyres on gravel → F_roll = 0.007 × 218000 × 9.81 ≈ 14,961 N
  # Drag: Cd ≈ 0.6, A ≈ 9 m², ρ = 1.225 kg/m³ → drag_c = Cd×A×ρ/2 ≈ 3.31 N/(m/s)²
  # At 10 km/h: total F_resist ≈ 15,100 N → decel ≈ 0.069 m/s² → coasts to 0 in ~40 s
  resistance:
    drag_coefficient: 3.3              # Aerodynamic drag [N/(m/s)²]  (was 2.5 — too low)
    rolling_resistance: 15000.0        # Rolling resistance force [N]  (was 1500 — Crr was 0.0007, now 0.007)

  # Operational limits
  limits:
    v_max_mps: 16.667                  # 60 km/h forward (reverse capped at 20 km/h)
    v_stop_eps: 0.5                    # Standstill speed threshold [m/s]
    v_kinematic_blend_mps: 3.0         # Low-speed kinematic blend threshold [m/s]

  # Linear tyre model parameters
  dynamics:
    mu_surface: 0.72                   # Surface friction coefficient (compact gravel)
    Cy_front_Npm: 2500000.0            # Front axle cornering stiffness [N/rad]
    Cy_rear_Npm: 2600000.0             # Rear axle cornering stiffness [N/rad]
    tire_relax_tau_s: 0.3              # Tire relaxation time constant [s]

# Surface friction reference values:
#   0.85  dry pavement
#   0.72  compact gravel  (default)
#   0.55  loose gravel
#   0.45  iron ore dust — dry
#   0.30  iron ore dust — wet
#   0.25  mud / slippery
