site_name: XCMG XDE320 — Vehicle Dynamics Simulator
site_description: Documentation for the XCMG XDE320 electric haul truck simulator, covering physics models, CAN architecture, and the Zephyr RTOS HIL port.
site_author: Mario Tilocca
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    scheme: slate
    primary: blue
    accent: light blue
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - js/mermaid-init.js

nav:
  - Home: index.md
  - Physics Models:
      - Vehicle Dynamics: VEHICLE_DYNAMICS.md
      - Architecture & Subsystems: ARCHITECTURE.md
      - Sensor System: SENSOR_SYSTEM.md
  - Zephyr RTOS Port:
      - Porting Guide: zephyr/ZEPHYR_PORT.md
      - RPi5 Setup: zephyr/ZEPHYR_RPI5_SETUP.md
      - Build, Flash & UART: zephyr/ZEPHYR_BUILD_FLASH_UART.md
  - Reference PDFs:
      - 3DOF Vehicle Dynamics: pdfs/3DOF_Vehicle_Dynamics_Implementation.pdf
      - Dugoff Tyre & Sensor Models: pdfs/Dugoff_Tyre_Sensor_Models.pdf
      - RTOS Implementation: pdfs/RTOS_Implementation.pdf
