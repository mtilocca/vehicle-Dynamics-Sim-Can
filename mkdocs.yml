site_name: XCMG XDE320 — Vehicle Dynamics Simulator
site_url: https://mtilocca.github.io/vehicle-Dynamics-Sim-Can/
site_description: High-fidelity vehicle dynamics simulation for electric autonomous vehicles — physics models, CAN bus integration, and Zephyr RTOS HIL port.
site_author: Mario Tilocca
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    scheme: slate
    primary: blue
    accent: light blue
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - js/mermaid-init.js

nav:
  - Home: index.md
  - Simulation Models:
      - Overview: models_overview.md
      - Sensor Suite: sensor_public.md
  - Zephyr HIL Port:
      - Overview: zephyr_overview.md
  - Reference PDFs:
      - Overview: pdfs/index.md
