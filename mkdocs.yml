site_name: Heavy-Duty Electric Vehicle — Vehicle Dynamics Simulator
site_url: https://mtilocca.github.io/vehicle-Dynamics-Sim-Can/
site_description: High-fidelity vehicle dynamics simulation for electric autonomous vehicles — physics models, CAN bus integration, and Zephyr RTOS HIL port.
site_author: Mario Tilocca
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    scheme: slate
    primary: blue
    accent: light blue
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - js/mermaid-init.js

nav:
  - Home: index.md
  - Simulation Models:
      - Overview: models_overview.md
      - Architecture: ARCHITECTURE.md
      - Vehicle Dynamics: VEHICLE_DYNAMICS.md
      - Sensor System: SENSOR_SYSTEM.md
      - Sensor Suite: sensor_public.md
  - Zephyr HIL Port:
      - Overview: zephyr/ZEPHYR_PORT.md
      - Build, Flash & OTA: zephyr/BUILD_AND_OTA.md
      - Web UI & HTTP API: zephyr/WEB_UI.md
      - MQTT(S) Control: zephyr/MQTT.md
  - Security & Boot:
      - Security Hardening: zephyr/SECURITY_HARDENING.md
      - MCUboot & OTA: zephyr/MCUBOOT_OTA.md
      - Signing & Flash Recovery: mcuboot_signing_and_flash_recovery.md
      - HTTPS / TLS: https_tls_implementation.md
      - Watchdog Boot-Loop Post-mortem: zephyr/IWDG_BOOT_LOOP_POSTMORTEM.md
  - Reference:
      - Build / Flash / UART (legacy): zephyr/ZEPHYR_BUILD_FLASH_UART.md
      - Raspberry Pi 5 Setup: zephyr/ZEPHYR_RPI5_SETUP.md
      - Reference PDFs: pdfs/index.md
