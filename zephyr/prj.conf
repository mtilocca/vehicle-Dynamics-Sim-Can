# ── Phase 1: Logging + UART Shell ────────────────────────────────────────────

CONFIG_MAIN_STACK_SIZE=4096

# ── Logging over USART3 (ST-Link VCP) ────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024

# ── Interactive shell ─────────────────────────────────────────────────────────
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096

# ── C++ support ───────────────────────────────────────────────────────────────
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_NEWLIB_LIBC=y

# ── Floating-point support in cbprintf ───────────────────────────────────────
CONFIG_CBPRINTF_FP_SUPPORT=y

# ── Heap — general heap (Zephyr k_malloc, network stack, shell)
# Reduced from 224 KB → 192 KB to offset the larger HTTP TLS thread stack.
# mbed TLS uses its own separate CONFIG_MBEDTLS_HEAP_SIZE pool (96 KB).
CONFIG_HEAP_MEM_POOL_SIZE=196608

# ── Networking ────────────────────────────────────────────────────────────────
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y

# ── Static IP (192.168.1.80) ─────────────────────────────────────────────────
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.80"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.1.1"

# ── Network buffers ───────────────────────────────────────────────────────────
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_TCP_TIME_WAIT_DELAY=0

# ── STM32 Ethernet HAL driver ─────────────────────────────────────────────────
CONFIG_ETH_STM32_HAL=y
CONFIG_ETH_STM32_HAL_RX_THREAD_PRIO=2
CONFIG_ETH_STM32_HAL_RX_THREAD_STACK_SIZE=1500

# ── TLS / mbed TLS (for HTTPS server) ────────────────────────────────────────
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y         # TLS socket API (implies MBEDTLS + TLS_CREDENTIALS)
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_TLS_VERSION_1_2=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_MBEDTLS_KEY_EXCHANGE_RSA_ENABLED=y
# ECDHE_RSA is required by Chrome and modern curl/OpenSSL.
# Static RSA (without ECDHE) was removed from Chrome in 2018.
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y    # NIST P-256 (most common curve)
CONFIG_MBEDTLS_ECP_DP_SECP384R1_ENABLED=y    # NIST P-384
CONFIG_MBEDTLS_PEM_CERTIFICATE_FORMAT=y
CONFIG_MBEDTLS_SHA256=y
CONFIG_MBEDTLS_SHA512=y
CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y
CONFIG_MBEDTLS_CIPHER_MODE_CBC_ENABLED=y
CONFIG_MBEDTLS_CIPHER_GCM_ENABLED=y          # GCM preferred by modern clients (AEAD)
CONFIG_MBEDTLS_ENABLE_HEAP=y
# 96 KB mbed TLS heap — ECDHE-RSA handshake peaks at 60-80 KB
CONFIG_MBEDTLS_HEAP_SIZE=98304
# mbed TLS debug — errors appear on UART during TLS handshake
CONFIG_MBEDTLS_DEBUG=y

# ── Thread introspection ──────────────────────────────────────────────────────
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# ── Memory protection + security hardening ────────────────────────────────────
CONFIG_MPU=y
CONFIG_HW_STACK_PROTECTION=y            # MPU catches stack overflow — replaces STACK_SENTINEL
CONFIG_FAULT_DUMP=2
CONFIG_ASSERT=y

# ── Hardware watchdog ─────────────────────────────────────────────────────────
# Watchdog temporarily disabled to isolate IWDG timing issue.
# Re-enable once boot is confirmed stable.
CONFIG_WATCHDOG=n
CONFIG_LOG_MODE_IMMEDIATE=y     # Keep immediate logging for diagnostics

# ── Phase 3: FDCAN1 CAN transport ────────────────────────────────────────────
CONFIG_CAN=y

# Loopback mode — set y for self-test without a physical transceiver.
CONFIG_HDV_CAN_LOOPBACK=y
