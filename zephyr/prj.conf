# ── RTOS ─────────────────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=8192

# ── FDCAN ─────────────────────────────────────────────────────────────────────
CONFIG_CAN=y
CONFIG_CAN_AUTO_BUS_OFF_RECOVERY=y

# ── Logging ───────────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# ── Interactive shell over USART3 ─────────────────────────────────────────────
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096

# ── C++ support ───────────────────────────────────────────────────────────────
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_LIBCPP_EXCEPTIONS=n
CONFIG_NEWLIB_LIBC=y

# ── Heap for STL containers (can_map, sensors) ────────────────────────────────
# Tune down after Phase 5 RAM audit if heap usage is low
CONFIG_HEAP_MEM_POOL_SIZE=131072

# ── Floating point (Cortex-M7 FPU required for plant physics) ─────────────────
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# ── Thread name visibility (helpful for debugging) ───────────────────────────
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
