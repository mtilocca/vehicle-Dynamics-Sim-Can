# ── Phase 0: UART boot check ─────────────────────────────────────────────────
# Minimal config — just logging over USART3.
# Add CONFIG_CAN=y in Phase 1, CONFIG_SHELL=y in Phase 2.

CONFIG_MAIN_STACK_SIZE=4096

# ── Logging over USART3 (ST-Link VCP) ─────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024

# ── C++ support ───────────────────────────────────────────────────────────────
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_NEWLIB_LIBC=y
