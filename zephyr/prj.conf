# ── Phase 1: Logging + UART Shell ────────────────────────────────────────────

CONFIG_MAIN_STACK_SIZE=4096
# Below watchdog (priority 2) so WDT feeds before main() logs banner
CONFIG_MAIN_THREAD_PRIORITY=3

# ── Logging over USART3 (ST-Link VCP) ────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024

# ── Interactive shell ─────────────────────────────────────────────────────────
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096

# ── C++ support ───────────────────────────────────────────────────────────────
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_NEWLIB_LIBC=y

# ── Floating-point support in cbprintf ───────────────────────────────────────
CONFIG_CBPRINTF_FP_SUPPORT=y

# ── Heap — general heap (Zephyr k_malloc, network stack, shell)
# 128 KB is ample now that mbed TLS is removed.
CONFIG_HEAP_MEM_POOL_SIZE=131072

# ── Networking ────────────────────────────────────────────────────────────────
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y

# ── Static IP (192.168.1.80) ─────────────────────────────────────────────────
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.80"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.1.1"
# 0 = return immediately, don't block for PHY link — threads start fast,
# watchdog_thread feeds IWDG before net config times out anything.
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

# ── Network buffers ───────────────────────────────────────────────────────────
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_TCP_TIME_WAIT_DELAY=0

# ── STM32 Ethernet HAL driver ─────────────────────────────────────────────────
CONFIG_ETH_STM32_HAL=y
CONFIG_ETH_STM32_HAL_RX_THREAD_PRIO=2
CONFIG_ETH_STM32_HAL_RX_THREAD_STACK_SIZE=1500


# ── Thread introspection ──────────────────────────────────────────────────────
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# ── Memory protection + security hardening ────────────────────────────────────
CONFIG_MPU=y
CONFIG_HW_STACK_PROTECTION=y            # MPU catches stack overflow — replaces STACK_SENTINEL
CONFIG_FAULT_DUMP=2
CONFIG_ASSERT=y

# ── Hardware watchdog ─────────────────────────────────────────────────────────
# Watchdog temporarily disabled to isolate IWDG timing issue.
# Re-enable once boot is confirmed stable.
CONFIG_WATCHDOG=y
CONFIG_LOG_MODE_IMMEDIATE=y     # Keep immediate logging for diagnostics

# ── MCUboot secure bootloader ────────────────────────────────────────────────
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
# Tell west not to sign — matches CONFIG_BOOT_SIGNATURE_TYPE_NONE in mcuboot.conf.
# Remove once ECDSA signing is confirmed working.
# Signed image — key set via MCUBOOT_SIGNING_KEY_FILE in CMakeLists.txt

# ── Phase 3c: TLS / mbedTLS (HTTPS on port 443) ──────────────────────────────
# NET_SOCKETS_SOCKOPT_TLS auto-selects MBEDTLS (if NET_NATIVE) and implies TLS_CREDENTIALS.
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_MBEDTLS_BUILTIN=y

# Increase TLS record buffer from the 1500 B default → 4096 B.
# Our HTML pages are up to ~8 KB, sent across multiple TLS records — 4 KB per record is fine.
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=4096

# Max simultaneous TLS contexts: 1 HTTPS + 1 reserved for future MQTTS client.
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2

# Enable runtime heap statistics — populates g_sys_stats.heap_used/free.
# Visible in the dashboard "System Resources" card.
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# ── Phase 3: FDCAN1 CAN transport ────────────────────────────────────────────
CONFIG_CAN=y

# Loopback mode — set y for self-test without a physical transceiver.
CONFIG_HDV_CAN_LOOPBACK=y
