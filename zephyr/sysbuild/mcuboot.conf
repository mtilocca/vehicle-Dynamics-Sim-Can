# MCUboot child image configuration
# Built automatically by west when CONFIG_BOOTLOADER_MCUBOOT=y

# ECDSA-P256 — only firmware signed with mcuboot_signing_key.pem will boot.
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y

# Maximum number of flash sectors MCUboot manages per image slot.
# 912 KB slot / ~4 KB sectors = 228 sectors; 512 is safe headroom.
CONFIG_BOOT_MAX_IMG_SECTORS=512

# Log level — INF shows chainload address and image validation result
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
